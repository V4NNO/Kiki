port_min=1025
port_max=49151

; A local endpoints to which node will listen to (whitespaces are not allowed!). Examples:
; hosts=                               # equivalent to 0.0.0.0 and ::
; hosts=0.0.0.0                        # any IPv4 (incl. loopback)
; hosts=::                             # any IPv6 (incl. loopback)
; hosts=192.168.1.6|::|192.168.46.23   # two given IPv4 and any IPv6
; hosts=127.0.0.1|192.168.45.60        # IPv4 loopback and another IPv4
hosts=

; A list of a hosts that will be declared to master-server as a node's addresses (with port!)
; (won't bound any sockets to this address). Example:
; extra_declare_hosts=111.222.000.111:8765|node.example.com:7904
extra_declare_hosts=

; Replace stale connections of a reconnecting viewer immediately.
; Set to 0 to keep the legacy duplicate-session timeout behavior.
fast_unt_reconnect=1

[db]
host=localhost
port=5432
name=kickidler_node
user=kickidler_node
pass=scout
driver=QPSQL
schema=
